<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOps 运维工单</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --line:#2a3441; --fg:#d8dee6; --dim:#8b98a5; --accent:#4da3ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; display:flex; height:100vh; }
  #side { width:300px; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side header { padding:14px; font-weight:700; border-bottom:1px solid var(--line); }
  #side header small { color:var(--dim); font-weight:400; display:block; }
  #tickets { flex:1; overflow-y:auto; }
  .tk { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .tk:hover, .tk.active { background:var(--panel); }
  .tk .st { float:right; font-size:12px; }
  .tk .t { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #newBtn { margin:10px; padding:8px; background:var(--accent); color:#fff; border:0; border-radius:6px; cursor:pointer; }
  #main { flex:1; display:flex; flex-direction:column; }
  #main header { padding:12px 18px; border-bottom:1px solid var(--line); }
  #chat { flex:1; overflow-y:auto; padding:18px; }
  .msg { margin-bottom:12px; max-width:78%; }
  .msg .who { font-size:12px; color:var(--dim); }
  .msg .body { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { margin-left:auto; } .msg.user .body { background:#1d2d44; }
  .msg.sys .body { background:transparent; border-style:dashed; color:var(--warn); }
  #report { border:1px solid var(--line); border-radius:8px; padding:14px; background:var(--panel); margin-bottom:12px; }
  #report h3 { margin-bottom:8px; } #report .conf { color:var(--accent); }
  #report ul { margin:6px 0 6px 18px; }
  #inputbar { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  #inputbar textarea { flex:1; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; resize:none; height:64px; }
  #inputbar button { background:var(--accent); border:0; border-radius:6px; color:#fff; padding:0 20px; cursor:pointer; }
  .st-submitted, .st-investigating { color:var(--warn); } .st-resolved { color:var(--ok); }
  .st-escalated_human, .st-failed { color:var(--bad); } .st-awaiting_info { color:var(--accent); }
  #obs { max-height:200px; overflow-y:auto; font-size:12px; color:var(--dim); border-top:1px solid var(--line); padding:8px 18px; }
  .actions button { margin:4px 8px 4px 0; padding:6px 12px; border-radius:6px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
  .actions button.confirm { background:var(--accent); color:#fff; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:20px; width:420px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog input, dialog textarea { width:100%; margin:6px 0; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; }
</style>
</head>
<body>
<div id="side">
  <header>AIOps 运维工单<small>多 Agent 证据化推理</small></header>
  <button id="newBtn">＋ 提交工单</button>
  <div id="tickets"></div>
</div>
<div id="main">
  <header><span id="tkTitle">选择或创建工单</span> <span id="tkStatus" class="st"></span>
    <a id="tkTrace" target="_blank" style="float:right;color:var(--accent);display:none">🔍 推理 Trace（Jaeger）</a></header>
  <div id="chat"><div id="reportBox"></div><div id="msgs"></div></div>
  <div id="obs"></div>
  <div id="inputbar">
    <textarea id="input" placeholder='补充信息（awaiting_info 时）或与工单交互…'></textarea>
    <button id="sendBtn">发送</button>
  </div>
</div>
<dialog id="dlg">
  <h3>提交运维工单</h3>
  <input id="fTitle" placeholder="标题，如：接口 5xx 突增">
  <textarea id="fContent" rows="4" placeholder="描述现象：哪个服务/接口、什么异常、何时开始"></textarea>
  <input id="fReporter" placeholder="提交人（可留空）">
  <div style="text-align:right"><button id="fCancel" style="background:none;color:var(--dim);border:0;cursor:pointer">取消</button>
  <button id="fOk" class="confirm">提交</button></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
let cur = null, es = null;

async function loadList() {
  const r = await fetch('/api/v1/tickets'); const d = await r.json();
  $('#tickets').innerHTML = (d.items||[]).map(t =>
    `<div class="tk ${t.id===cur?'active':''}" onclick="openTicket('${t.id}')">
      <span class="st st-${t.status}">${t.status}</span>
      <div>${t.title}</div><div class="t">${t.id} · ${t.type||''}</div></div>`).join('') || '<div style="padding:14px;color:var(--dim)">暂无工单</div>';
}
function openTicket(id) {
  cur = id; if (es) es.close();
  document.querySelectorAll('.tk').forEach(e=>e.classList.remove('active'));
  $('#msgs').innerHTML=''; $('#reportBox').innerHTML=''; $('#obs').innerHTML='';
  loadList(); refresh(); connectSSE(id);
}
async function refresh() {
  if (!cur) return;
  const r = await fetch('/api/v1/tickets/'+cur); const d = await r.json();
  $('#tkTitle').textContent = `${d.id} · ${d.title}`;
  $('#tkStatus').textContent = d.status; $('#tkStatus').className = 'st st-'+d.status;
  $('#tkTrace').style.display = d.trace_url ? '' : 'none';
  if (d.trace_url) $('#tkTrace').href = d.trace_url;
  $('#msgs').innerHTML = (d.messages||[]).map(renderMsg).join('');
  $('#chat').scrollTop = $('#chat').scrollHeight;
  renderReport(d);
  loadObs();
}
function renderMsg(m) {
  const who = m.role==='user' ? '提交人' : (m.agent ? 'Agent · '+m.agent : '系统');
  const cls = m.role==='user'?'user':(m.role==='system'?'sys':'');
  return `<div class="msg ${cls}"><div class="who">${who}</div><div class="body">${esc(m.content)}</div></div>`;
}
function renderReport(d) {
  const r = d.report;
  if (!r) { $('#reportBox').innerHTML=''; return; }
  $('#reportBox').innerHTML = `<div id="report">
    <h3>📋 事故报告 <span class="conf">置信度 ${(r.confidence*100).toFixed(0)}%</span></h3>
    <p><b>根因：</b>${esc(r.root_cause)}</p><p><b>摘要：</b>${esc(r.summary)}</p>
    ${r.timeline&&r.timeline.length?'<b>时间线</b><ul>'+r.timeline.map(t=>`<li>${esc(t.event)}${t.source?' <span style="color:var(--dim)">['+t.source+']</span>':''}</li>`).join('')+'</ul>':''}
    ${r.recommendations&&r.recommendations.length?'<b>处置建议</b><div class="actions">'+
      r.recommendations.map((rec,i)=>`<span><button onclick='askAction(${i})'>${rec.risk==='low'?'⚡':'🔒'} ${esc(rec.action)}</button></span>`).join('')+'</div>'+
      '<ul>'+r.recommendations.map(rec=>`<li>[${rec.risk==='low'?'低危·可自动':'高危·需人工'}] ${esc(rec.description)} → ${esc(rec.target||'')}</li>`).join('')+'</ul>':''}
    ${r.missing_evidence&&r.missing_evidence.length?'<b>缺失证据</b><ul>'+r.missing_evidence.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}
  </div>`;
  window._report = r;
}
function askAction(i) {
  const rec = window._report.recommendations[i];
  const dep = (rec.target||'').replace(/^deployment\//,'') || prompt('目标 Deployment：');
  if (!dep) return;
  const confirmed = confirm(`执行「${rec.action}」于 ${dep}？\n${rec.description}\n确认后立即执行并写入审计。`);
  if (!confirmed) return;
  const body = rec.action==='k8s.scale' || rec.action==='scale'
    ? {tool:'k8s.scale', input:{deployment:dep, replicas: rec.target_replicas || parseInt(prompt('目标副本数：','1'))||1, confirmed:true}}
    : {tool:'k8s.rollout_undo', input:{deployment:dep, confirmed:true}};
  fetch(`/api/v1/tickets/${cur}/actions`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{ alert(d.status==='ok' ? '已执行' : ('未执行: '+(d.degraded_reason||d.error||''))); loadObs(); });
}
async function loadObs() {
  const r = await fetch(`/api/v1/tickets/${cur}/observations`); const d = await r.json();
  $('#obs').innerHTML = (d.items||[]).map(o=>`<div>▪ <b style="color:${o.status==='ok'?'var(--ok)':'var(--bad)'}">${o.status}</b> ${esc(o.summary)}</div>`).join('');
}
function connectSSE(id) {
  es = new EventSource(`/api/v1/tickets/${id}/stream`);
  es.addEventListener('message', e => { $('#msgs').insertAdjacentHTML('beforeend', renderMsg(JSON.parse(e.data))); $('#chat').scrollTop = $('#chat').scrollHeight; });
  es.addEventListener('status', async e => { const d=JSON.parse(e.data); $('#tkStatus').textContent=d.status; $('#tkStatus').className='st st-'+d.status; await refresh(); loadList(); });
  es.onerror = () => { es.close(); es = null; };
}
$('#newBtn').onclick = () => $('#dlg').showModal();
$('#fCancel').onclick = () => $('#dlg').close();
$('#fOk').onclick = async () => {
  const title=$('#fTitle').value.trim(), content=$('#fContent').value.trim();
  if (!title||!content) return;
  const r = await fetch('/api/v1/tickets',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title,content,reporter:$('#fReporter').value})});
  const d = await r.json(); $('#dlg').close();
  $('#fTitle').value=$('#fContent').value=$('#fReporter').value='';
  await loadList(); openTicket(d.id);
};
$('#sendBtn').onclick = async () => {
  const v = $('#input').value.trim(); if (!v||!cur) return;
  const r = await fetch(`/api/v1/tickets/${cur}/reply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:v})});
  const d = await r.json(); if (d.error) alert(d.error);
  $('#input').value=''; refresh();
};
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
loadList(); setInterval(()=>{ if(cur) refresh(); }, 8000);
</script>
</body>
</html>
