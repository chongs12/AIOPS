# Remediation CRD —— 故障处置的声明式表达。
# 注意：helm 的 crds/ 目录仅随 install 安装、不随 upgrade 更新；
# schema 变更后需手动 kubectl apply 本文件。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediations.aiops.io
spec:
  group: aiops.io
  scope: Namespaced
  names:
    kind: Remediation
    listKind: RemediationList
    plural: remediations
    singular: remediation
    shortNames: ["rem"]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ticket
          type: string
          jsonPath: .spec.ticketRef
        - name: Action
          type: string
          jsonPath: .spec.action
        - name: Target
          type: string
          jsonPath: .spec.deployment
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Approver
          type: string
          jsonPath: .status.approval.approver
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["deployment", "action"]
              properties:
                ticketRef:
                  type: string
                  description: 来源工单 ID（console/脚本来源可空）
                deployment:
                  type: string
                  minLength: 1
                  description: 目标 Deployment（同 namespace）
                action:
                  type: string
                  enum: ["k8s.scale", "k8s.rollout_undo"]
                  description: 处置动作
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  description: scale 动作的目标副本数（undo 忽略）
                reason:
                  type: string
                  description: 根因摘要（供人审批参考，进 Events）
                verify:
                  type: object
                  description: 恢复回验配置（零值字段用 operator 默认值）
                  properties:
                    template:
                      type: string
                      description: promtool 指标模板名（如 http_5xx_rate）
                    threshold:
                      type: number
                      format: double
                      description: 达标阈值（模板语义下的恢复线）
                    waitSeconds:
                      type: integer
                      description: 执行后到首次回验的等待秒数
                    attempts:
                      type: integer
                      description: 回验未达标时的最大复查次数
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - PendingApproval
                    - Executing
                    - Verifying
                    - Succeeded
                    - Failed
                    - Escalated
                    - Rejected
                observedGeneration:
                  type: integer
                  format: int64
                  description: 已处理的 spec 代数（幂等闸：== generation 表示动作已执行）
                message:
                  type: string
                approval:
                  type: object
                  properties:
                    approved:
                      type: boolean
                    approver:
                      type: string
                      description: 审批人身份（JWT 用户名）
                    at:
                      type: string
                      format: date-time
                    note:
                      type: string
                execution:
                  type: object
                  properties:
                    startedAt:
                      type: string
                      format: date-time
                    completedAt:
                      type: string
                      format: date-time
                    fromReplicas:
                      type: integer
                      format: int32
                    toReplicas:
                      type: integer
                      format: int32
                    revisionFrom:
                      type: integer
                      format: int64
                    revisionTo:
                      type: integer
                      format: int64
                    error:
                      type: string
                verification:
                  type: object
                  properties:
                    value:
                      type: number
                      format: double
                    threshold:
                      type: number
                      format: double
                    attempts:
                      type: integer
                    lastCheckAt:
                      type: string
                      format: date-time
                    result:
                      type: string
                      enum: ["passed", "failed", "error"]
                conditions:
                  type: array
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: ["lastTransitionTime", "message", "reason", "status", "type"]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
