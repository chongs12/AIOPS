image:
  repository: aiops-server
  tag: dev

service:
  port: 8090

metrics:
  scrape: true   # Prometheus 注解抓取（ai_tokens_total 等指标）

ingress:
  enabled: true
  host: aiops.localhost

hostGatewayIp: "192.168.65.254"   # 从 Pod 访问宿主机的网关 IP（kind on Docker Desktop）
config:
  prometheusBaseUrl: http://makejob-prometheus.default.svc.cluster.local:9090
  jaegerBaseUrl: http://makejob-jaeger.default.svc.cluster.local:16686
  otlpEndpoint: collector.default.svc.cluster.local:4317
  postgresHost: host.docker.internal
  postgresPort: "5433"
  redisAddr: host.docker.internal:6380
  milvusAddr: host.docker.internal:19530
  slowQueryThresholdSeconds: "1"

auth:
  enabled: false

llm:
  baseUrl: https://ark.cn-beijing.volces.com/api/coding/v3
  model: deepseek-v4-flash

secrets:
  pgPassword: aiops_dev
  llmApiKey: ""
  jwtSecret: change-me-in-prod
