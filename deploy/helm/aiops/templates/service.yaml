apiVersion: v1
kind: Service
metadata:
  name: aiops
spec:
  selector: { app: aiops }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8090
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops
                port: { number: {{ .Values.service.port }} }
{{- end }}
