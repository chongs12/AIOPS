apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "scale", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops
subjects:
  - kind: ServiceAccount
    name: aiops
    namespace: {{ .Release.Namespace }}
