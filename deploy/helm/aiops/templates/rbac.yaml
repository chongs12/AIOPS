apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "scale", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops
subjects:
  - kind: ServiceAccount
    name: aiops
    namespace: {{ .Release.Namespace }}
---
# scale 子资源独立 RBAC 条目：GetScale/UpdateScale 走 /deployments/x/scale，
# 主资源的 verbs 不自动覆盖子资源（dev 模式管理员 kubeconfig 掩盖了这一点）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-scale-subresource
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-scale-subresource
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-scale-subresource
subjects:
  - kind: ServiceAccount
    name: aiops
    namespace: {{ .Release.Namespace }}
